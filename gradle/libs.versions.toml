[versions]
agp = "8.5.2"
kotlin = "2.0.0"
coroutines = "1.8.1"
room = "2.6.1"
datastore = "1.1.1"
media3 = "1.3.1"
composeBom = "2024.09.03"
composeCompiler = "1.5.14"
navigationCompose = "2.8.0"
activityCompose = "1.9.1"
kotlinxSerialization = "1.7.3"
retrofitKotlinxSerialization = "2.11.0"
hilt = "2.51.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
swiperefreshlayout = "1.1.0"
viewpager2 = "1.0.0"
recyclerview = "1.3.2"
coreKtx = "1.13.1"
activityKtx = "1.9.1"
fragmentKtx = "1.8.2"
lifecycle = "2.8.4"
retrofit = "2.11.0"
okhttp = "4.12.0"
jsoup = "1.17.2"
gson = "2.11.0"
glide = "4.16.0"
materialdrawer = "6.1.1"
ahbottomnavigation = "2.2.0"
circleimageview = "2.2.0"
kenburnsview = "1.0.7"
flowlayout = "0.4.1"
jiaozivideoplayer = "6.2.12"
exoplayer = "2.19.1"
recyclerviewAnimators = "4.0.2"
customactivityoncrash = "2.2.0"
dexter = "6.2.3"
junit = "4.13.2"
coroutinesCore = "1.8.1"
coroutinesAndroid = "1.8.1"

[libraries]
# AndroidX
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
cardview = { group = "androidx.cardview", name = "cardview", version = "1.0.0" }
palette = { group = "androidx.palette", name = "palette", version = "1.0.0" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
coreKtx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
activityKtx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
fragmentKtx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
percentlayout = { group = "androidx.percentlayout", name = "percentlayout", version = "1.0.0" }

# Lifecycle
lifecycleViewmodelKtx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycleLivedataKtx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycleRuntimeKtx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Coroutines
coroutinesCore = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutinesAndroid = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Room
roomRuntime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
roomKtx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
roomCompiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
datastorePreferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Compose
composeBom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
composeUi = { group = "androidx.compose.ui", name = "ui" }
composeUiTooling = { group = "androidx.compose.ui", name = "ui-tooling" }
composeUiToolingPreview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
composeMaterial3 = { group = "androidx.compose.material3", name = "material3" }
composeMaterialIconsExtended = { group = "androidx.compose.material", name = "material-icons-extended" }
activityCompose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigationCompose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
lifecycleRuntimeCompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycleViewmodelCompose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Media3
media3Exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3Ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3Hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }

# Serialization
kotlinxSerializationJson = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
retrofitKotlinxSerialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofitKotlinxSerialization" }

# Material
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Hilt
hiltAndroid = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hiltCompiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# View
materialdrawer = { group = "com.mikepenz", name = "materialdrawer", version.ref = "materialdrawer" }
ahbottomnavigation = { group = "com.aurelhubert", name = "ahbottomnavigation", version.ref = "ahbottomnavigation" }
circleimageview = { group = "de.hdodenhof", name = "circleimageview", version.ref = "circleimageview" }
kenburnsview = { group = "com.flaviofaria", name = "kenburnsview", version.ref = "kenburnsview" }
flowlayout = { group = "com.wefika", name = "flowlayout", version.ref = "flowlayout" }

# Glide
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glideCompiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converterGson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Player
jiaozivideoplayer = { group = "cn.jzvd", name = "jiaozivideoplayer", version.ref = "jiaozivideoplayer" }
exoplayer = { group = "com.google.android.exoplayer", name = "exoplayer", version.ref = "exoplayer" }

# RecyclerView Animators
recyclerviewAnimators = { group = "jp.wasabeef", name = "recyclerview-animators", version.ref = "recyclerviewAnimators" }

# Crash reporting
customactivityoncrash = { group = "cat.ereza", name = "customactivityoncrash", version.ref = "customactivityoncrash" }

# Permissions
dexter = { group = "com.karumi", name = "dexter", version.ref = "dexter" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
